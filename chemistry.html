<script>
const LANGS = [
  { code: 'en', label: 'EN',  native: 'English'  },
  { code: 'ko', label: '한국어', native: 'Korean'  },
  { code: 'zh', label: '中文', native: 'Chinese'  },
  { code: 'es', label: 'ES',  native: 'Español'  },
];

const STORAGE_KEY = 'selectedLanguage';

let currentLang = localStorage.getItem(STORAGE_KEY) || 'en';
let vocabData = null;
let openCategories = new Set([0]);

const accordionEl  = document.getElementById('accordion');
const searchInput  = document.getElementById('searchInput');
const clearBtn     = document.getElementById('clearSearch');
const resultCountEl = document.getElementById('resultCount');
const emptyStateEl = document.getElementById('emptyState');
const langSwitchEl = document.getElementById('langSwitch');
const mainContent  = document.getElementById('main-content');

function adjustMainPadding() {
  const searchHeader = document.getElementById('search-header');
  const topBar = document.querySelector('header');
  const totalOffset = (topBar?.offsetHeight || 56) + (searchHeader?.offsetHeight || 0);
  mainContent.style.paddingTop = (totalOffset + 16) + 'px';
}

window.addEventListener('resize', adjustMainPadding);

function renderLangSwitch() {
  langSwitchEl.innerHTML = LANGS.map(l => `
    <button
      id="lang-btn-${l.code}"
      class="lang-btn px-3 py-1.5 rounded-full font-label text-label-sm border border-outline-variant bg-surface-container transition-all"
      data-lang="${l.code}"
      data-active="${l.code === currentLang}"
      aria-pressed="${l.code === currentLang}">
      ${l.label}
    </button>
  `).join('');

  langSwitchEl.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentLang = btn.dataset.lang;
      localStorage.setItem(STORAGE_KEY, currentLang);
      renderLangSwitch();
      renderAccordion(searchInput.value.trim());
    });
  });
}

function highlight(text, q) {
  if (!q) return text;
  const idx = text.toLowerCase().indexOf(q.toLowerCase());
  if (idx === -1) return text;
  return (
    text.slice(0, idx) +
    '<mark>' + text.slice(idx, idx + q.length) + '</mark>' +
    text.slice(idx + q.length)
  );
}

function filterTerms(q) {
  if (!q) return vocabData.categories.map((c, i) => ({ catIndex: i, category: c.category, terms: c.terms }));
  const lower = q.toLowerCase();
  return vocabData.categories.map((c, i) => {
    const terms = c.terms.filter(t =>
      t.en.toLowerCase().includes(lower) ||
      t.ko.toLowerCase().includes(lower) ||
      t.zh.toLowerCase().includes(lower) ||
      t.es.toLowerCase().includes(lower)
    );
    return { catIndex: i, category: c.category, terms };
  }).filter(c => c.terms.length > 0);
}

function renderAccordion(query = '') {
  const filtered  = filterTerms(query.trim());
  const total     = filtered.reduce((sum, c) => sum + c.terms.length, 0);
  const totalAll  = vocabData.categories.reduce((s, c) => s + c.terms.length, 0);
  const isEn       = currentLang === 'en';
  const nativeName = LANGS.find(l => l.code === currentLang).native;

  resultCountEl.textContent = query
    ? `${total} term${total !== 1 ? 's' : ''} found`
    : `${totalAll} terms across ${vocabData.categories.length} categories`;

  emptyStateEl.classList.toggle('hidden', total > 0);
  accordionEl.classList.toggle('hidden', total === 0);

  const forceOpen = query.trim().length > 0;

  accordionEl.innerHTML = filtered.map(c => {
    const isOpen = forceOpen || openCategories.has(c.catIndex);
    const rows = c.terms.map(t => isEn ? `
      <div class="term-row px-4 py-2.5 rounded-lg items-baseline cursor-default transition-colors">
        <span class="font-body text-body-md text-on-surface">${highlight(t.en, query)}</span>
      </div>
    ` : `
      <div class="term-row grid grid-cols-2 gap-3 px-4 py-2.5 rounded-lg items-baseline cursor-default transition-colors">
        <span class="font-body text-body-md text-on-surface">${highlight(t.en, query)}</span>
        <span class="font-body text-body-md text-primary">${highlight(t[currentLang], query)}</span>
      </div>
    `).join('');

    const headerHtml = isEn ? `
      <div class="px-4 pb-xs pt-xs border-t border-outline-variant">
        <span class="font-label text-label-sm text-on-surface-variant uppercase tracking-wider">English</span>
      </div>
    ` : `
      <div class="grid grid-cols-2 gap-3 px-4 pb-xs pt-xs border-t border-outline-variant">
        <span class="font-label text-label-sm text-on-surface-variant uppercase tracking-wider">English</span>
        <span class="font-label text-label-sm text-on-surface-variant uppercase tracking-wider">${nativeName}</span>
      </div>
    `;

    return `
      <section class="card-paper rounded-xl overflow-hidden">
        <button class="cat-btn w-full flex items-center justify-between px-md py-sm text-left hover:bg-surface-container-high transition-colors"
          aria-expanded="${isOpen}" data-cat="${c.catIndex}">
          <span class="flex items-center gap-sm">
            <span class="font-label text-label-sm font-bold text-on-primary-container bg-primary-container rounded-full w-6 h-6 flex items-center justify-center shrink-0">
              ${c.terms.length}
            </span>
            <span class="font-headline text-body-md font-semibold text-on-background">
              ${c.category[currentLang]}
            </span>
          </span>
          <span class="material-symbols-outlined chevron text-on-surface-variant transition-transform duration-200 text-xl">expand_more</span>
        </button>

        <div class="cat-panel ${isOpen ? 'open' : ''}">
          <div>
            ${headerHtml}
            ${rows}
            <div class="pb-xs"></div>
          </div>
        </div>
      </section>
    `;
  }).join('');

  accordionEl.querySelectorAll('.cat-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = Number(btn.dataset.cat);
      if (openCategories.has(idx)) openCategories.delete(idx);
      else openCategories.add(idx);
      renderAccordion(searchInput.value);
    });
  });
}

searchInput.addEventListener('input', e => {
  clearBtn.classList.toggle('hidden', !e.target.value);
  renderAccordion(e.target.value);
});

clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  clearBtn.classList.add('hidden');
  renderAccordion('');
  searchInput.focus();
});

fetch('data/chemistry_vocab_4lang.json')
  .then(r => r.json())
  .then(data => {
    vocabData = data;

    // Deep-link support: ?q=term (from Word of the Day / global search) prefills the search box
    const urlParams = new URLSearchParams(window.location.search);
    const qParam = urlParams.get('q');
    if (qParam) {
      searchInput.value = qParam;
      clearBtn.classList.remove('hidden');
    }

    renderLangSwitch();
    renderAccordion(searchInput.value);
    adjustMainPadding();
  })
  .catch(err => {
    accordionEl.innerHTML = `
      <div class="card-paper rounded-xl p-md text-center">
        <span class="material-symbols-outlined text-error text-4xl block mb-sm">error_outline</span>
        <p class="font-body text-body-md text-error">Could not load chemistry vocabulary data.</p>
        <p class="font-label text-label-sm text-on-surface-variant mt-xs">Check that data/chemistry_vocab_4lang.json exists.</p>
      </div>`;
    console.error(err);
  });
</script>
